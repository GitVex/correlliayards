# Both halves of the deployment, in one file, because they are not independently
# useful: the browser has to see a single origin (the session cookie is HttpOnly
# and SameSite=Lax — see the Caddyfile), so the SPA's Caddy is the only way in
# and the API answers only behind it.
#
# Postgres is deliberately absent. Coolify provisions it as a resource of its
# own and hands over a connection string; declaring a database here as well
# would give the stack a second, empty one and leave which of them holds the
# data down to which url got pasted where.
services:
  corelliayards:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_CORELLIAYARDS_8300
      - API_ORIGIN=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8300/"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    networks:
      - default
      - shared
    environment:
      - DATABASE_URL=${DATABASE_URL:?set this to the Coolify Postgres resource connection string, without sslmode}
      - DATABASE_SSL=${DATABASE_SSL:-disable}
      - ZITADEL_ISSUER=${ZITADEL_ISSUER:?the Zitadel issuer url}
      - ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID:?}
      - ZITADEL_CLIENT_SECRET=${ZITADEL_CLIENT_SECRET:?}
      - APP_BASE_URL=${APP_BASE_URL:?the public https origin of the SPA, e.g. https://cards.example.com}
      - SESSION_SECRET=${SESSION_SECRET:?at least 32 characters}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

networks:
  shared:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
