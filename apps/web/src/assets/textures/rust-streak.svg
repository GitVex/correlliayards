<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240">
  <!-- Weeping stains, the kind that run down from a seam or a rivet. Same trick
       as the mottle, but the turbulence is stretched hard on Y so the patches
       elongate into vertical runs, and a gradient mask fades them out downward. -->
  <defs>
    <filter id="streak" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.004" numOctaves="4" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.55
                0 0 0 0 0.24
                0 0 0 0 0.09
                1.0 0 0 0 -0.6"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fademask">
      <rect width="600" height="240" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="600" height="240" filter="url(#streak)" mask="url(#fademask)"/>
</svg>
