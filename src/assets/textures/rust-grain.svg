<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Fine tooth of the metal. Tiles seamlessly (stitchTiles) so it can cover a
       panel of any size without a visible repeat. Painted grey and blended in
       CSS with `overlay`, so it only modulates whatever colour sits beneath. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.17"/>
</svg>
