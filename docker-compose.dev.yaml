# Local Postgres only — the deploy compose lives in apps/web. Nothing reads this
# yet; apps/api arrives in a later phase and this is what it will connect to.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: corellia
      POSTGRES_PASSWORD: corellia
      POSTGRES_DB: corellia_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corellia -d corellia_dev"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
